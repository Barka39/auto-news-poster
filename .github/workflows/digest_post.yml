name: Digest Post

on:
  # Монголын цагаар 12:00 болон 19:00 (UTC+8):
  #   12:00 МН = 04:00 UTC
  #   19:00 МН = 11:00 UTC
  # + Өглөөний NBA 13:00 МН = 05:00 UTC (шөнийн тоглолтууд дууссаны дараа)
  # + Бүсийн байрлал Даваа 14:00 МН = 06:00 UTC
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 11 * * *"
    - cron: "0 5 * * *"
    - cron: "0 6 * * 1"

  workflow_dispatch:
    inputs:
      mode:
        description: "news | nba | standings"
        default: "nba"

concurrency:
  group: auto-news-poster
  cancel-in-progress: false

jobs:
  post-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout кодыг татах
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python тохируулах
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Font суулгах (Кирилл дэмждэг)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core ffmpeg

      - name: Dependencies суулгах
        run: pip install -r requirements.txt
      - name: Chromium (карт рендер) — кэштэй
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.47.0
      - name: Chromium суулгах
        run: python -m playwright install --with-deps chromium

      - name: Тойм бичиж постлох
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          NBA_PAGE_ID_EXPECTED: ${{ vars.NBA_PAGE_ID_EXPECTED }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          # GitHub cron-ийг хэдэн цагаар хойшлуулдаг тул бодит цаг биш, ямар cron
          # мөр өдөөснөөр горимоо сонгоно
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "0 5 * * *") MODE=nba ;;
              "0 6 * * 1") MODE=standings ;;
              *) MODE=news ;;
            esac
          fi
          echo "digest горим: $MODE"
          case "$MODE" in
            nba) python digest.py --nba ;;
            standings) python digest.py --standings ;;
            *) python digest.py ;;
          esac

      - name: posted_ids.json commit хийх
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add posted_ids.json ledger.json || true
          git diff --staged --quiet || git commit -m "posted_ids шинэчлэгдлээ (digest) [skip ci]"
          for i in 1 2 3; do
            git push && break
            echo "push мөргөлдлөө — rebase хийж дахин оролдоно ($i)"
            git pull --rebase --autostash origin main || break
          done
